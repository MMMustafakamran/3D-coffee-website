services:
  api:
    build: ./backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_PATH: /app/data/ember-demo.sqlite
      FRONTEND_ORIGIN: http://localhost
      STAFF_DEMO_KEY: ember-demo-staff
    volumes:
      - ember-demo-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ember-demo-data:
